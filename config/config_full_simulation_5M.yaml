# Depth-sweep config: 5M reads per sample.
# Generated by scripts/make_sim_configs.py from
# config_full_simulation.yaml. Edit that script, not this file.

# Paper-ready simulation config: the default, full-depth simulation run.
# 10 samples covering all eight ASimulatoR event classes plus two mixtures, 10M
# reads each, chr21 and chr19, monorail_light backend (lean STAR plus Python
# aggregator, so no Singularity image pulls and no whole-genome reference
# download). The fastder parameter grid below is the one used for the paper
# figures.
#
# This is the 10M point of the depth sweep. The other depths are generated
# from this file by scripts/make_sim_configs.py as config_full_simulation_5M
# .yaml and so on. Run them with the Makefile (make simulations).
#
#   FASTDER_EVAL_CONFIG=../config/config_full_simulation.yaml \
#     snakemake --use-conda --use-singularity --cores 12

seed: 10
cores: 12

asimulator:
  seq_depth: 5000000  # 5M reads per sample
  multi_events_per_exon: false
  strand_specific: true
  probs_as_freq: true

  # All eight event classes ASimulatoR supports (Manz et al. 2021), one sample
  # each, plus two mixtures. The four added in the revision are ir, a3, a5 and
  # mee. Intron retention gives one continuous coverage block where the truth
  # is exon, intron, exon, which is the hardest case for a coverage segmenter.
  # a3 and a5 shift a single boundary by a few bases, which is what tests
  # junction-anchored boundary placement.
  samples:
    es:
      es: 1.0
    mes:
      mes: 1.0
    ir:
      ir: 1.0
    a3:
      a3: 1.0
    a5:
      a5: 1.0
    mee:
      mee: 1.0
    afe:
      afe: 1.0
    ale:
      ale: 1.0
    mixed_terminal:
      es: 0.25
      mes: 0.25
      afe: 0.25
      ale: 0.25
    mixed_internal:
      ir: 0.25
      a3: 0.25
      a5: 0.25
      mee: 0.25

monorail:
  backend: monorail_light
  ref_version: hg38
  project_name: "local"
  project_id: 101
  pump_source: asimulator

fastder:
  stranded: false
  # Final-run parameter grid: the cross-product is 2 x 2 x 4 = 16 fastder
  # runs per scenario. position_tolerance is swept so the fastder pt vs
  # derfinder maxregiongap comparison in the report has data. pt5 is fastder's
  # default; pt10 and pt20 extend the range, since stitching engages more often
  # as pt exceeds the gap between a coverage-derived ER edge and the true splice
  # site. pt0 is NOT a no-stitching corner: Integrator::within_threshold reduces
  # to exact coordinate equality at 0, so chains still form wherever an ER edge
  # lands exactly on a splice site. Use --no-stitch to turn stitching off.
  min_coverage: [0.01, 0.05]
  min_length: [10, 25]
  position_tolerance: [0, 5, 10, 20]
  # chr21 is small and gene-poor; chr19 is the most gene-dense chromosome and
  # is the one the GTEx cross-tool run uses, so the two together test both
  # extremes of gene density.
  # Ablation for the junction-integration question: false is the normal run,
  # true emits every expressed region on its own, unsnapped. Snapping cannot be
  # switched off separately, because the snap coordinate comes from the
  # junction that joined two regions.
  no_stitch: [false, true]
  chromosomes: ["chr21", "chr19"]
  # One core, matching the single thread Snakemake gives derfinder, groHMM and
  # the megadepth baseline. Without this the runtime comparison would put
  # fastder on config["cores"] against single-threaded competitors.
  cores: 1

grohmm:
  # 4 x 2 = 8 combos, matching derfinder's 8-combo grid for a fair
  # comparison. LtProbB is the log-prob of staying in the transcribed
  # state; values closer to zero make the HMM leave it more readily,
  # breaking the gene-span blocks that merge exons and introns. Those
  # merges are the dominant base-precision loss (far larger than the
  # 50 bp window boundary quantization), so the sweep is shifted toward
  # zero from the earlier [-100, -500] range, where base precision and
  # sensitivity both peaked at the least-negative end. UTS is the
  # untranscribed-state variance (default 5); higher values raised
  # sensitivity, so the grid uses [10, 15].
  ltprobb: [-25, -50, -100, -200]
  uts: [10, 15]

gffcompare:
  reference_annotation: ""
