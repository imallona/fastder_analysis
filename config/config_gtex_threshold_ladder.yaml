# GTEx coverage threshold ladder: the first sub-group of each tissue of
# config_gtex_comparison.yaml, chr19, three tools over a ladder of
# min_coverage values, graded against the annotation.
# scripts/choose_threshold.py picks the threshold with the best exon-level F1.
# Generated by scripts/make_gtex_ladder_config.py from
# config_gtex_comparison.yaml. Edit that script, not this file.

seed: 10
cores: 12
monorail: {ref_version: hg38, project_name: recount3, project_id: 105, backend: recount3}
recount3:
  data_source: gtex
  base_url: https://duffel.rail.bio/recount3
  metadata_url: https://duffel.rail.bio/recount3
  groups:
    brain_1:
      study: BRAIN
      samples: [GTEX-1117F-3226-SM-5N9CT.1, GTEX-13O3Q-0011-R4a-SM-5P9H2.1, GTEX-16GPK-0011-R11b-SM-7MKFF.1,
        GTEX-1GZHY-0011-R9a-SM-9WG5R.1, GTEX-NPJ7-0011-R6a-SM-2I3G7.1]
    heart_1:
      study: HEART
      samples: [GTEX-1117F-0726-SM-5GIEN.1, GTEX-13SLX-0926-SM-5S2NM.1, GTEX-1B8KE-0126-SM-793AM.1,
        GTEX-1JK1U-0626-SM-CKZOJ.1, GTEX-T6MN-0926-SM-5S2S3.1]
    muscle_1:
      study: MUSCLE
      samples: [GTEX-1117F-0426-SM-5EGHI.1, GTEX-13YAN-0526-SM-5O9BE.1, GTEX-1C6VQ-0326-SM-7DHMS.1,
        GTEX-1M4P7-0126-SM-DKPQF.1, GTEX-T2IS-2626-SM-32QPP.1]
    blood_1:
      study: BLOOD
      samples: [GTEX-111YS-0006-SM-5NQBE.1, GTEX-14PN3-0006-SM-7SB6O.1, GTEX-1HGF4-0002-SM-EZ6M7.1,
        GTEX-OIZI-0005-SM-2XCED.1, GTEX-WFG8-0006-SM-3GIKS.1]
fastder:
  stranded: false
  min_coverage: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  chromosomes: [chr19]
  cores: 1
gffcompare: {reference_annotation: ''}
tools: [fastder, derfinder, megadepth_baseline]
threshold_choice: true
