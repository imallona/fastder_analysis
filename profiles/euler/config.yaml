# Snakemake profile for the ETH Euler cluster. See slurm/README.md.
# Every Slurm setting lives here; nothing under workflow/ knows about Slurm.
# Used through the Makefile: make gtex-comparison EULER=1.

executor: slurm

default-resources:
  # From my_share_info. Unset, the plugin guesses from the last job.
  slurm_account: es_platt
  # Floor for rules added later; every current rule declares both.
  mem_mb: 4000
  runtime: 60
  # What bounds the share held. --cores does not work on a cluster.
  # The Makefile passes --resources cores_used=N when EULER=1.
  cores_used: threads

# The five rules whose wall clock reaches the paper. Euler mixes EPYC 9654,
# 7742, 7H12 and 7763, and a timing on one is not comparable with another.
# Not exclusive: that would book 128 cores per job. Co-tenancy can inflate a
# wall clock, which Methods states. test_euler_profile.py pins this set.
set-resources:
  run_fastder:
    slurm_extra: "'--constraint=EPYC_7763'"
  run_fastder_scaling:
    slurm_extra: "'--constraint=EPYC_7763'"
  run_derfinder:
    slurm_extra: "'--constraint=EPYC_7763'"
  run_grohmm:
    slurm_extra: "'--constraint=EPYC_7763'"
  run_megadepth_baseline:
    slurm_extra: "'--constraint=EPYC_7763'"

  # Node-local scratch in MB. Slurm reserves none by default.
  # ml_star_align holds STAR scratch and the sort spill; ml_star_index stages
  # the reference. test_euler_profile.py pins this set too.
  ml_star_align:
    slurm_extra: "'--tmp=20000'"
  ml_star_index:
    slurm_extra: "'--tmp=5000'"

# Concurrent jobs. cores_used above is the binding limit.
jobs: 32

# Euler asks that Slurm not be flooded; the default is ten per second.
max-jobs-per-second: 2

# Cores for jobs the driver runs itself rather than submitting.
local-cores: 4

# Lustre metadata lags behind a job that has just written its output.
latency-wait: 60

retries: 2
printshellcmds: true
rerun-incomplete: true

# The plugin deletes successful job logs by default.
slurm-keep-successful-logs: true

# Not set: software-deployment-method, since only the simulation targets need
# a container. Not set: the storage-provider keys, since Euler shares its
# filesystems across nodes.
